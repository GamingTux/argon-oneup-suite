name: CI & Package Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev shellcheck python3 gcc-aarch64-linux-gnu device-tree-compiler

      - name: Syntax & Lint check
        run: |
          echo "=== Checking Python syntax ==="
          python3 -m py_compile src/argon-power-profiles/usr/sbin/argon-power-profiles
          python3 -m py_compile src/argon-oneup-sensors/usr/sbin/ksystemstats-rpi5-fix
          python3 -m py_compile src/argon-oneup-essentials/usr/sbin/argononeup-eepromconfig.py
          python3 -m py_compile src/cm5-mmc-fix/usr/bin/cm5-mmc-fix
          python3 -m py_compile src/rpi-fake-sleep/usr/bin/rpi-fake-sleep
          python3 -m py_compile src/rpi-fake-sleep/usr/bin/argon-power-bench
          python3 -m py_compile src/rpi-fake-sleep/usr/bin/rpi-pishutdown

          echo "=== Checking Shell syntax ==="
          bash -n build_packages.sh
          find src extras -type f -name "postinst" -exec sh -n {} +
          find src extras -type f -name "postrm" -exec sh -n {} +
          find src extras -type f -name "prerm" -exec sh -n {} +
          sh -n src/argon-oneup-backlight/usr/sbin/argon-backlight-init
          sh -n src/argon-oneup-sensors/usr/bin/ksystemstats-cpuinfo-gen
          sh -n src/argon-oneup-essentials/usr/sbin/argon-essentials-apply
          sh -n src/argon-oneup-essentials/usr/bin/argon-oneup-irq-policy
          sh -n src/argon-oneup-essentials/usr/bin/argon-brightness-step

      - name: Build Debian packages
        run: |
          chmod +x build_packages.sh
          ./build_packages.sh

      - name: Verify package integrity
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          for deb in *.deb extras/*.deb; do
            echo "--- $deb ---"
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argon-oneup-packages
          path: |
            dist/*.deb
            dist/extras/*.deb

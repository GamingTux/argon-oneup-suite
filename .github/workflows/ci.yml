name: CI, Package Build & APT Repository

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build Packages, APT Repo & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils shellcheck python3 gcc-aarch64-linux-gnu device-tree-compiler

      - name: Syntax & Lint check
        run: |
          echo "=== Checking Python syntax ==="
          python3 -m py_compile src/argon-oneup-power-profiles/usr/sbin/argon-oneup-power-profiles
          python3 -m py_compile src/argon-oneup-power-profiles/usr/bin/powerprofilesctl
          python3 -m py_compile src/argon-oneup-essentials/usr/sbin/argononeup-eepromconfig.py
          python3 -m py_compile extras/ksystemstats-rpi5-fix/usr/sbin/ksystemstats-rpi5-fix
          python3 -m py_compile extras/cm5-mmc-fix/usr/bin/cm5-mmc-fix
          python3 -m py_compile extras/rpi-fake-sleep/usr/bin/rpi-fake-sleep
          python3 -m py_compile extras/rpi-fake-sleep/usr/bin/argon-power-bench
          python3 -m py_compile extras/rpi-pishutdown/usr/bin/rpi-pishutdown

          echo "=== Checking Shell syntax ==="
          bash -n build_packages.sh
          bash -n scripts/build_apt_repo.sh
          find src extras -type f -name "postinst" -exec bash -n {} +
          find src extras -type f -name "postrm" -exec bash -n {} +
          find src extras -type f -name "prerm" -exec bash -n {} +
          bash -n src/argon-oneup-backlight/usr/sbin/argon-backlight-init
          bash -n extras/ksystemstats-rpi5-fix/usr/bin/ksystemstats-cpuinfo-gen
          sh -n src/argon-oneup-essentials/usr/sbin/argon-essentials-apply

      - name: Build Debian packages
        run: |
          chmod +x build_packages.sh
          ./build_packages.sh

      - name: Verify package integrity
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          for deb in *.deb extras/*.deb; do
            echo "--- $deb ---"
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done

      - name: Import GPG Key for APT Signing
        if: env.APT_GPG_KEY != ''
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$APT_GPG_KEY" | gpg --batch --import
          gpg --list-secret-keys

      - name: Generate APT Repository
        run: |
          chmod +x scripts/build_apt_repo.sh
          ./scripts/build_apt_repo.sh

      - name: Deploy APT Repository to GitHub Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argon-oneup-packages
          path: |
            dist/*.deb
            dist/extras/*.deb
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Argon ONE UP Suite ${{ github.ref_name }}"
          files: |
            dist/*.deb
            dist/extras/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

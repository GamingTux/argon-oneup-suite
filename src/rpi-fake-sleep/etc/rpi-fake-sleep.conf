# /etc/rpi-fake-sleep.conf
# Configuration for rpi-fake-sleep (Raspberry Pi Userspace Suspend Handler)

# Maximum battery percentage loss allowed while sleeping with lid closed on battery.
# When this loss is reached, the system powers off cleanly to preserve battery charge.
# Set to 0 to disable (in which case only the 5% hardware floor will trigger shutdown).
MAX_BATTERY_LOSS_PERCENT=10

# Turn off internal keyboard USB power/backlight when the lid is closed.
# Prevents heat buildup against the LCD panel in the closed laptop chassis.
# Safely ignored on Desktop Pis (where no lid switch exists).
DISABLE_KEYBOARD_WHEN_CLOSED=true

# Enable Wi-Fi 802.11 power saving while suspended.
# Puts the wireless chip into DTIM sleep mode to reduce quiescent power.
SUSPEND_WIFI_POWERSAVE=true

# Block Bluetooth radio while suspended.
# Stops background BLE scanning and beacon broadcasts.
SUSPEND_BLUETOOTH_BLOCK=true

# Enable USB autosuspend for idle audio devices.
ENABLE_AUDIO_AUTOSUSPEND=true

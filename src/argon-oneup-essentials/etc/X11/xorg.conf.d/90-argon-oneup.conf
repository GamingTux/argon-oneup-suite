# ==============================================================================
# Argon ONE UP Laptop Touchpad Configuration
# /etc/X11/xorg.conf.d/90-argon-oneup.conf
# Enable tap-to-click and tap-dragging by default
# ==============================================================================

Section "InputClass"
  Identifier "Argon ONE UP Laptop Touchpad"
  MatchIsTouchpad "on"
  MatchDevicePath "/dev/input/event*"
  Driver "libinput"
  Option "Tapping" "on"
  Option "TappingDrag" "on"
EndSection

# ==============================================================================
# Argon ONE UP Hardware Quirks
# /etc/modprobe.d/argon-oneup.conf
# ==============================================================================

# Fix SunplusIT PC Camera (11cc:2812) USB audio endpoint 0x86 sample rate query
# timeouts (eliminates ~1.5s boot hang) & microphone volume scaling
options snd_usb_audio quirk_flags=0x11cc:0x2812:skip_iface_setup,0x11cc:0x2812:fixed_rate,0x11cc:0x2812:get_sample_rate,0x11cc:0x2812:mic_res_16

# Disable unused CSI camera ISP backend nodes (/dev/video20-35)
# Laptop uses internal USB webcam (uvcvideo); eliminates 16 dummy camera devices
blacklist pisp_be

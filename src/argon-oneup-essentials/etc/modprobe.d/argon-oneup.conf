# ==============================================================================
# Argon ONE UP Hardware Quirks & Blacklists
# /etc/modprobe.d/argon-oneup.conf
# ==============================================================================

# Internal USB Webcam (SunplusIT PC Camera 11cc:2812):
# Fix endpoint 0x86 sample rate query errors & mic volume scaling
options snd_usb_audio quirk_flags=0x11cc:0x2812:skip_iface_setup,0x11cc:0x2812:fixed_rate,0x11cc:0x2812:get_sample_rate,0x11cc:0x2812:mic_res_16

# Disable unused CSI ISP camera nodes (/dev/video20+ pispbe) so internal USB webcam is default
install pisp_be /bin/true

# Blacklist unpopulated/unrouted RP1 buses to prevent dummy device enumeration
blacklist rp1_pio
blacklist rp1_fw
blacklist spidev
blacklist spi_bcm2835

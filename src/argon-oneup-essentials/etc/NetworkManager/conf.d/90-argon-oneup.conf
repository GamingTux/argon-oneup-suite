# ==============================================================================
# Argon ONE UP NetworkManager Configuration
# /etc/NetworkManager/conf.d/90-argon-oneup.conf
# ==============================================================================

[connection]
# Disable aggressive Wi-Fi power saving on laptop to prevent latency spikes & packet drops
wifi.powersave=2

[keyfile]
# Ignore unpopulated CM5 onboard Ethernet PHY
unmanaged-devices=interface-name:eth0

# ==============================================================================
# Argon ONE UP NetworkManager Configuration
# /etc/NetworkManager/conf.d/90-argon-oneup.conf
# ==============================================================================
# Keep the unused CM5 onboard Gigabit Ethernet PHY unmanaged.
# The laptop does not have an RJ45 port; keeping eth0 unmanaged avoids carrier
# polling wakeups and allows the PHY to stay in low-power standby mode.

[keyfile]
unmanaged-devices=interface-name:eth0

# ==============================================================================
# Argon ONE UP Laptop Hardware Configuration
# /etc/argon-oneup.conf
# Apply changes: sudo argon-essentials-apply
# ==============================================================================

# Use external Wi-Fi/Bluetooth antenna in the display lid (dtparam=ant2)
# Required for proper wireless reception through the aluminum laptop chassis.
ENABLE_ANT2=1

# Enable M.2 NVMe slot at PCIe Gen 3 speed (dtparam=nvme, dtparam=pciex1_gen=3)
ENABLE_NVME=1

# Enable hardware I2C bus (dtparam=i2c_arm=on)
# Required for battery fuel gauge (CW2217) and display DDC/CI brightness control.
ENABLE_I2C=1

# Apply Argon ONE UP quiet blower fan curve
# (40C/50C/60C/70C with 5C hysteresis)
ENABLE_FAN_CURVE=1

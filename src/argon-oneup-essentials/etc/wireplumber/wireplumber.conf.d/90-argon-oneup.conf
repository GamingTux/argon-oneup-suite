# ==============================================================================
# Argon ONE UP WirePlumber Audio Quirks
# /etc/wireplumber/wireplumber.conf.d/90-argon-oneup.conf
# ==============================================================================
# Disable the silent internal display HDMI-to-eDP bridge audio device.
# The laptop panel has no speakers; keeping this sink disabled prevents PipeWire
# from defaulting audio playback to the silent display instead of the 3.5mm jack
# and cleans up the desktop audio mixer. External HDMI audio (vc4-hdmi-0) remains enabled.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-107c706400.hdmi"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

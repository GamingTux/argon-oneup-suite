# ==============================================================================
# Argon ONE UP WirePlumber Audio Routing
# /etc/wireplumber/wireplumber.conf.d/90-argon-oneup.conf
# Route primary audio through internal USB DAC (Speakers/Headphone jack)
# ==============================================================================

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-107c706400.hdmi"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

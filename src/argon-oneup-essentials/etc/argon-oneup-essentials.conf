# Argon ONE UP Essentials Hardware & Overclock Configuration
# Changes can be applied at any time by running: sudo argon-essentials-apply

# Maximum CPU frequency in MHz for Raspberry Pi 5 / CM5 (Default: 2800)
ARM_FREQ=2800

# Use external Wi-Fi/Bluetooth antenna in the display lid (dtparam=ant2)
ENABLE_ANT2=1

# Enable M.2 NVMe slot at PCIe Gen 3 speed (8 GT/s, ~900 MB/s)
ENABLE_NVME_GEN3=1

# Enable DWC2 USB 2.0 Host bus (internal keyboard/touchpad/webcam/audio) and 1.6A USB current
ENABLE_USB_HOST_AND_MAX_CURRENT=1

# Put unpopulated CM5 Gigabit Ethernet PHY (BCM54213PE) into MDIO BMCR_PDOWN suspend (-0.3W)
DISABLE_UNUSED_ETHERNET=1

# Apply Argon ONE UP 4-stage quiet blower fan curve (40C/50C/60C/70C with 5C hysteresis)
ENABLE_FAN_CURVE=1

# Disable camera auto-detection (CSI I2C probe). Argon ONE UP uses a USB webcam (SunplusIT PC Camera)
DISABLE_CAMERA_PROBE=1

# Disable display auto-detection (DSI probe). Argon ONE UP uses an HDMI/eDP bridge display
DISABLE_DISPLAY_PROBE=1

# Disable unrouted UART0 (GPIO 14/15). Debug console is on ttyAMA10, Bluetooth is on ttyS0
DISABLE_UART=1

# Disable boot-time filesystem check (fsck.vfat) on /boot/firmware to eliminate ~250-300ms boot delay
OPTIMIZE_FSTAB_FSCK=1

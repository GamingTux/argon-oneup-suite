# ==============================================================================
# Argon ONE UP Hardware Configuration for rpi-suspend
# /etc/rpi-suspend.conf.d/90-argon-oneup.conf
# ==============================================================================
# - Selects argon-oneup hardware profile
# - Configures internal display on eDP-1 (with kernel patch) / HDMI-A-2
# - Cuts power to Webcam (port 4), Keyboard (port 6) & Touchpad (port 7) in sleep
# - Unbinds TRRS headset remote HID (1-1.1:1.3) so USB audio chip autosuspends
# - Soft-blocks Wi-Fi & Bluetooth via rfkill during sleep
# - Enables clamshell docked mode and dynamic display blanking

PROFILE="argon-oneup"
INTERNAL_DISPLAY="eDP-1 HDMI-A-2"

# Cut power to Webcam (port 4), Keyboard (port 6), and Touchpad (port 7)
CUSTOM_POWER_CUT_PATHS="/sys/bus/usb/devices/1-1:1.0/1-1-port[467]/disable"
SLEEP_CUSTOM_POWER_CUTS=true

# Unbind headset button so C-Media audio chip can enter USB runtime autosuspend
CUSTOM_USBHID_UNBIND="1-1.1:1.3"

# Soft-block wireless radios in sleep to save power (~0.3-0.5W)
SLEEP_WIFI_RFKILL=true
SLEEP_BLUETOOTH_RFKILL=true

# Clamshell mode & safety watchdogs
CLAMSHELL_ENABLE=true
CLAMSHELL_DISABLE_INTERNAL_INPUT=true
WATCHDOG_MAX_BATTERY_LOSS_PERCENT=10

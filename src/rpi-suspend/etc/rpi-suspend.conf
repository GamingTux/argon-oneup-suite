# ==============================================================================
# /etc/rpi-suspend.conf
# Universal Userspace Suspend, Standby & Clamshell Manager for Raspberry Pi
# ==============================================================================
#
# Configuration Priority (later layers override earlier layers):
#   1. Built-in defaults
#   2. Hardware profile (/usr/share/rpi-suspend/profiles/<PROFILE>.conf)
#   3. Settings in this file (/etc/rpi-suspend.conf)
#   4. Drop-in overrides (/etc/rpi-suspend.conf.d/*.conf)
#
# Commands:
#   rpi-suspend status                  -> Inspect active settings & displays
#   rpi-suspend profiles                -> List available hardware profiles
#   sudo rpi-suspend set-profile <name> -> Switch hardware profile
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. HARDWARE PROFILE SELECTION
# ------------------------------------------------------------------------------
# Loads hardware-specific display & USB power paths from:
# /usr/share/rpi-suspend/profiles/<PROFILE>.conf
# Built-in profiles: generic, argon-oneup, uconsole, devterm, crowview, pitop4
PROFILE="generic"


# ==============================================================================
# MODE 1: DEEP STANDBY / SUSPEND (systemctl suspend)
# ==============================================================================
# Toggle each universal power-saving mechanism individually (true / false):

# Lock active desktop sessions (Wayland/X11) before entering sleep
SLEEP_LOCK_SCREEN=true

# Pause playing media (Firefox, Chromium, VLC, Spotify, MPV) via D-Bus MPRIS2
SLEEP_PAUSE_MEDIA=true

# Mute ALSA Master & PipeWire audio sinks during sleep and restore on wakeup
SLEEP_MUTE_AUDIO=true

# Turn off all connected monitors/displays via DRM KMS, Wayland & X11 DPMS
SLEEP_BLANK_DISPLAYS=true

# Set panel backlight brightness (/sys/class/backlight/*) to 0 during sleep
SLEEP_DIM_BACKLIGHT=true

# Turn off keyboard backlight LEDs (/sys/class/leds/*kbd*backlight*) in sleep
SLEEP_DIM_KBD_BACKLIGHT=true

# Freeze desktop user processes (app.slice) via Kernel cgroups v2 (0% CPU load)
SLEEP_FREEZE_PROCESSES=true

# Set CPU scaling governor to 'powersave' and clamp clock to minimum frequency
SLEEP_CPU_POWERSAVE=true

# Single-Core WFI Parking: Pin tasks, workqueues & IRQs to CPU0 so Cores 1-3 sleep
SLEEP_CPU_PARKING=true

# Enable power-efficient kernel workqueue scheduling during sleep
SLEEP_WORKQUEUE_POWERSAVE=true

# Enable USB runtime autosuspend on USB audio devices & internal USB 2.0 hubs
SLEEP_USB_AUTOSUSPEND=true

# Enable Wi-Fi 802.11 DTIM power-save (keeps SSH & network alive at low power)
SLEEP_WIFI_POWERSAVE=true

# Completely disable Wi-Fi via rfkill during sleep (overrides SLEEP_WIFI_POWERSAVE)
SLEEP_WIFI_RFKILL=false

# Completely disable Bluetooth via rfkill during sleep and restore on wakeup
SLEEP_BLUETOOTH_RFKILL=false

# Stop PWM cooling fan (0 dB silent standby; protected by thermal watchdog below)
SLEEP_FAN_SILENT=true

# Execute hardware-specific USB port power cuts defined by the active PROFILE
SLEEP_CUSTOM_POWER_CUTS=true

# Run custom hook scripts in /etc/rpi-suspend/hooks.d/ ('pre' and 'post')
SLEEP_RUN_HOOKS=true


# ==============================================================================
# MODE 2: DOCKED CLAMSHELL MODE (Lid closed with external monitor connected)
# ==============================================================================
# Handled by rpi-suspend-lid.service when a laptop lid switch is present:

# Enable Clamshell Mode when closing the lid while an external monitor is connected
# (true = stay awake on external monitor; false = suspend system even when docked)
CLAMSHELL_ENABLE=true

# Automatically trigger 'systemctl suspend' when closing the lid WITHOUT external monitor
CLAMSHELL_SUSPEND_UNDOCKED=true

# Turn off the internal laptop display (INTERNAL_DISPLAY) when lid is closed in docked mode
CLAMSHELL_BLANK_INTERNAL_DISPLAY=true

# Set internal laptop panel backlight to 0 when lid is closed in docked mode
CLAMSHELL_DIM_INTERNAL_BACKLIGHT=true

# Turn off internal keyboard backlight LEDs when lid is closed in docked mode
CLAMSHELL_DIM_KBD_BACKLIGHT=true

# Cut power to internal keyboard/touchpad (CUSTOM_POWER_CUT_PATHS) when lid is closed
# so pressure on the closed lid cannot trigger accidental key presses
CLAMSHELL_DISABLE_INTERNAL_INPUT=true

# Lock desktop session when entering Clamshell Mode (false = continue working seamlessly)
CLAMSHELL_LOCK_ON_CLOSE=false

# Run custom hook scripts in /etc/rpi-suspend/hooks.d/ ('docked' and 'undocked')
CLAMSHELL_RUN_HOOKS=true


# ==============================================================================
# MODE 3: WAKEUP SOURCES (What wakes the Pi from Deep Standby)
# ==============================================================================

# Wake up when opening the laptop lid (SW_LID = 0)
WAKE_ON_LID_OPEN=true

# Wake up when pressing the Power / Sleep / Wake button
WAKE_ON_POWER_BUTTON=true

# Wake up when pressing any key on an internal or external keyboard
WAKE_ON_KEYBOARD=true

# Wake up when clicking a mouse button (Left, Right, Middle)
WAKE_ON_MOUSE_CLICK=true

# Wake up on mere mouse movement or touchpad touch (false prevents desk vibrations from waking)
WAKE_ON_MOUSE_MOVE=false


# ==============================================================================
# MODE 4: SAFETY WATCHDOGS & TELEMETRY
# ==============================================================================

# Monitor SoC temperature during sleep and re-enable fan if threshold is exceeded
WATCHDOG_THERMAL_ENABLE=true
WATCHDOG_THERMAL_TEMP_MC=68000

# Monitor battery drain during lid-closed sleep on battery and power off cleanly
# if battery loss exceeds WATCHDOG_MAX_BATTERY_LOSS_PERCENT
WATCHDOG_BATTERY_ENABLE=true
WATCHDOG_MAX_BATTERY_LOSS_PERCENT=10

# Log a 1-line standby summary (duration, battery %/h, top IRQs/s) to journalctl on wake
LOG_WAKEUP_SUMMARY=true


# ==============================================================================
# 5. HARDWARE TOPOLOGY OVERRIDES (Normally provided automatically by PROFILE)
# ==============================================================================
# Uncomment only if you want to manually override the active hardware profile:
# INTERNAL_DISPLAY="eDP-* LVDS-* DSI-*"
# CUSTOM_POWER_CUT_PATHS=""
# CUSTOM_USBHID_UNBIND=""

# Argon ONE UP Laptop — lm-sensors configuration (Raspberry Pi CM5)
# Managed by argon-oneup-sensors package

chip "cpu_thermal-virtual-*"
    label temp1 "CPU Temperature"

# RP1 south bridge die temperature and internal power rail ADC channels
chip "rp1_adc-isa-*"
    label temp1 "RP1 Southbridge"
    label in1   "1.8V Rail"
    label in2   "3.3V Rail"
    label in3   "1.5V Rail A"
    label in4   "1.5V Rail B"

# PWM fan speed tachometer
chip "pwmfan-isa-*"
    label fan1 "CPU Fan"
    ignore pwm1
    ignore pwm1_enable

# Maxio MAP1202 NVMe controller temperature
chip "nvme-pci-*"
    label temp1 "NVMe SSD"
    ignore temp2
    ignore temp3

# CellWise CW2217 Fuel Gauge (battery telemetry)
chip "BAT0-*"
    label in0    "Battery Voltage"
    label temp1  "Battery Temperature"
    label curr1  "Battery Current"
    label power1 "Battery Power"

# BCM2712 PMIC under-voltage alarm flag
chip "rpi_volt-isa-*"
    ignore in0
